<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Step-by-step guided tank car and tanker inspection with photo documentation and printable reports. Works offline.">
<title>Tank Car Inspection</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/report.css">
</head>
<body>

<div id="boot" class="boot">Loading inspection…</div>

<!-- ============================ Wizard ============================ -->
<div class="app" id="app">

  <header class="topbar">
    <div class="topbar__row">
      <div class="topbar__id">
        <span class="topbar__app">Tank Car Inspection</span>
        <span class="topbar__car" id="carLabel">New inspection</span>
      </div>
      <div class="topbar__right">
        <span class="savestate" id="saveState">Saved</span>
        <button type="button" class="iconbtn" id="menuBtn" aria-label="Menu">☰</button>
      </div>
    </div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Inspection progress">
      <div class="progress__bar" id="progressBar"></div>
      <span class="progress__label" id="progressLabel">0%</span>
    </div>
    <nav class="rail" id="rail" aria-label="Inspection steps"></nav>
  </header>

  <main class="stepScroll" id="stepScroll">
    <section class="step" id="stepHost" aria-live="polite"></section>
  </main>

  <footer class="navbar">
    <button type="button" class="btn btn--ghost" id="backBtn">← Back</button>
    <button type="button" class="btn btn--primary" id="nextBtn">Next →</button>
  </footer>

</div>

<!-- ============================ Report ============================ -->
<div class="reportview" id="reportView">
  <div class="reportbar">
    <button type="button" class="btn btn--ghost" id="backToWizard">← Back to inspection</button>
    <div class="reportbar__actions">
      <button type="button" class="btn" id="exportJsonBtn">⬇️ Backup (JSON)</button>
      <button type="button" class="btn" id="exportHtmlBtn">⬇️ Report (HTML)</button>
      <button type="button" class="btn btn--primary" id="printBtn">🖨 Print / Save as PDF</button>
    </div>
  </div>
  <div id="reportHost"></div>
</div>

<!-- ============================= Menu ============================= -->
<div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Menu">
  <div class="menu__panel">
    <div class="menu__head">
      <h3>Menu</h3>
      <button type="button" class="iconbtn" id="menuClose" aria-label="Close menu">✕</button>
    </div>
    <div class="menu__body" id="menuBody"></div>
  </div>
</div>

<script src="js/schema.js"></script>
<script src="js/storage.js"></script>
<script src="js/report.js"></script>
<script src="js/app.js"></script>
</body>
</html>
